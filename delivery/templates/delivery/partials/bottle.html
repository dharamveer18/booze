{# Illustration used when a product has no photo. Shape depends on category, colour on product. #}
{% if product.image_url %}
  <img src="{{ product.image_url }}" alt="{{ product.name }}" loading="lazy">
{% else %}
  {% with shape=product.category.bottle_shape c=product.color %}
  <svg class="bottle" viewBox="0 0 100 140" role="img" aria-label="{{ product.name }}">
    <ellipse cx="50" cy="134" rx="30" ry="4" fill="#000" opacity=".08"/>
    {% if shape == "can" %}
      <rect x="28" y="22" width="44" height="110" rx="9" fill="{{ c }}"/>
      <rect x="31" y="16" width="38" height="10" rx="4" fill="#c9ccd1"/>
      <rect x="28" y="52" width="44" height="46" fill="#fff" opacity=".92"/>
      <text x="50" y="80" text-anchor="middle" font-size="11" font-weight="800" fill="{{ c }}" font-family="Inter, sans-serif">{{ product.brand|slice:":4"|upper }}</text>
      <rect x="34" y="26" width="5" height="100" rx="2.5" fill="#fff" opacity=".25"/>
    {% elif shape == "wine" %}
      <rect x="44" y="6" width="12" height="10" rx="2" fill="#2d2d2d"/>
      <path d="M45 16h10v28c0 6 15 12 15 26v58a5 5 0 0 1-5 5H35a5 5 0 0 1-5-5V70c0-14 15-20 15-26z" fill="{{ c }}"/>
      <rect x="32" y="82" width="36" height="34" rx="2" fill="#fbf6ea"/>
      <text x="50" y="103" text-anchor="middle" font-size="9" font-weight="700" fill="#3b2a1a" font-family="Georgia, serif">{{ product.brand|slice:":5" }}</text>
      <rect x="35" y="70" width="4" height="60" rx="2" fill="#fff" opacity=".2"/>
    {% else %}
      <rect x="42" y="4" width="16" height="12" rx="2" fill="#1f1f1f"/>
      <rect x="43" y="16" width="14" height="20" fill="{{ c }}" opacity=".85"/>
      <path d="M43 36h14c0 8 17 10 17 26v66a6 6 0 0 1-6 6H32a6 6 0 0 1-6-6V62c0-16 17-18 17-26z" fill="{{ c }}"/>
      <rect x="30" y="74" width="40" height="38" rx="3" fill="#fff" opacity=".94"/>
      <text x="50" y="97" text-anchor="middle" font-size="10" font-weight="800" fill="#222" font-family="Inter, sans-serif">{{ product.brand|slice:":5"|upper }}</text>
      <rect x="31" y="60" width="5" height="68" rx="2.5" fill="#fff" opacity=".22"/>
    {% endif %}
  </svg>
  {% endwith %}
{% endif %}
